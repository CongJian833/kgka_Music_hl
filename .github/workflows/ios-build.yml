name: Build Unsigned iOS IPA

# 触发条件：
#   1. 推送到 master 或 main 分支时自动构建
#   2. 也可在 Actions 页面手动触发 (workflow_dispatch)
# 说明：本工作流只构建「未签名 IPA」并在 Artifacts 提供下载，不创建 Release。
#       所有 rm/recreate 都只发生在 CI 的临时工作区，不会改动仓库中的任何源码。
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# 仅需读取仓库内容、上传构建产物
permissions:
  contents: read

jobs:
  build-ipa:
    name: Build Unsigned IPA (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 拉取 Git LFS 内容（*.png / *.ico / *.pbxproj 由 LFS 跟踪，AppIcon 需要真实图片）
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # 重建 iOS 工程（保证 Xcode 工程与当前 Flutter 版本匹配），
      # 并补上「后台音频播放」权限（音乐类 App 必需）。仅在 CI 临时目录内操作。
      - name: Recreate iOS project
        run: |
          rm -rf ios/
          flutter create --platforms=ios .
          # Flutter 3.47.x 的 _missingDevelopmentTeam() 通过
          # buildSettings.containsKey('DEVELOPMENT_TEAM') 判断是否有 Team，
          # 而 flutter create 未指定 team 时该键不存在，会偶发误报
          # "requires a selected Development Team"。注入占位值让键存在
          # （值无所谓，--no-codesign 仍会跳过实际签名）。
          perl -pi -e 's/(\t*INFOPLIST_FILE = Runner\/Info\.plist;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = 0000000000;/' ios/Runner.xcodeproj/project.pbxproj
          grep -c "DEVELOPMENT_TEAM = 0000000000" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add UIBackgroundModes:0 string audio" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName KA Music" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string KA Music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName KA Music" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleName string KA Music" ios/Runner/Info.plist

      # 用 lib/assets/logo.png（1024x1024）经 sips 生成全部 iOS 图标尺寸，覆盖默认图标
      - name: Replace AppIcon with logo
        run: |
          LOGO=lib/assets/logo.png
          DIR=ios/Runner/Assets.xcassets/AppIcon.appiconset
          if [ "$(head -c4 "$LOGO")" != "$(printf '\x89PNG')" ]; then
            echo "❌ logo.png 不是真实 PNG（可能是 LFS pointer 未拉取）"
            exit 1
          fi
          gen() {
            sips -z "$2" "$2" "$LOGO" --out "$DIR/$1" >/dev/null
            echo "  ✓ $1 ($2x$2)"
          }
          gen Icon-App-1024x1024@1x.png 1024
          gen Icon-App-83.5x83.5@2x.png 167
          gen Icon-App-76x76@2x.png 152
          gen Icon-App-76x76@1x.png 76
          gen Icon-App-60x60@3x.png 180
          gen Icon-App-60x60@2x.png 120
          gen Icon-App-40x40@3x.png 120
          gen Icon-App-40x40@2x.png 80
          gen Icon-App-40x40@1x.png 40
          gen Icon-App-29x29@3x.png 87
          gen Icon-App-29x29@2x.png 58
          gen Icon-App-29x29@1x.png 29
          gen Icon-App-20x20@3x.png 60
          gen Icon-App-20x20@2x.png 40
          gen Icon-App-20x20@1x.png 20
          echo "✅ AppIcon 已替换为 logo"

      # 未签名打包：--no-codesign 跳过所有签名步骤，无需证书/描述文件
      - name: Build iOS app (unsigned)
        run: |
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export DEVELOPMENT_TEAM=""
          flutter build ios --release --no-codesign

      # 将 Runner.app 打包成未签名 .ipa（Payload 目录 + zip）
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r kgka_music.ipa Payload
          echo "✅ IPA created: $(du -h kgka_music.ipa | cut -f1)"
          rm -rf Payload

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgka-music-unsigned-ipa
          path: kgka_music.ipa
          retention-days: 30
